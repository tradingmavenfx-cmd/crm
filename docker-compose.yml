services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
    container_name: crm-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # The app role cannot bypass row-level security; the owner runs
      # migrations. Create the role with: npm run db:setup-role
      DATABASE_URL: postgresql://crm_app:crm_app_dev_password@postgres:5432/crm?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?schema=public
      APP_DB_PASSWORD: crm_app_dev_password
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      # Set to "true" on first run to seed demo data (tenant "acme")
      SEED: 'true'
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: crm-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  crm_pgdata:
